name: Frontend

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r requirements-test.txt
      - run: npm test
      - name: Real Home Assistant picker, editor and saved card
        env:
          SETLISTFM_LIVE_DIR: ${{ runner.temp }}/setlistfm-live
        run: |
          mkdir -p "$SETLISTFM_LIVE_DIR"
          python -m pytest tests/test_live_frontend.py -q >"$SETLISTFM_LIVE_DIR/host.log" 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          status=0
          npm run test:ha || status=$?
          wait "$host_pid" || status=$?
          trap - EXIT
          cat "$SETLISTFM_LIVE_DIR/host.log"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-screenshots
          path: |
            test-results/**/*.png
            ${{ runner.temp }}/setlistfm-live/*.png
            ${{ runner.temp }}/setlistfm-live/live-result.json
