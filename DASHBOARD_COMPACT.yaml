# Compact Setlist.fm Dashboard - Raw Configuration Editor
# Copy ONLY the YAML below (starting with "views:")
# Replace every full entity ID with the actual ID in your entity settings.
# IDs do not inherently start with setlistfm_; legacy references are placeholders.
# Lists are display-filtered; Next concert uses all API-available setlists.

views:
  - title: Concerts
    path: concerts-compact
    icon: mdi:music
    badges: []
    cards:
      # Compact Header
      - type: markdown
        content: |
          # &#127925; Concerts
          
          **{{ states('sensor.setlistfm_ianpleasance_concerts') }}** shown

      # Next Concert Highlight
      - type: markdown
        content: |
          ## &#127919; Next Concert
          
          {% set entity = 'sensor.yourname_next_concert' %}
          {% if has_value(entity) %}
          
          **{{ state_attr(entity, 'artist') }}**
          
          &#128205; {{ state_attr(entity, 'venue') }}
          
          &#128197; {{ states(entity) }}
          [View setlist]({{ state_attr(entity, 'url') }})
          {% else %}
          No upcoming setlist available, or integration unavailable.
          {% endif %}

      # Recent List (Compact)
      - type: markdown
        content: |
          ## &#127928; Recent
          
          {% set concerts = state_attr('sensor.setlistfm_ianpleasance_concerts', 'concerts') %}
          {% if concerts %}
            {% set ns = namespace(count=0) %}
            {% for concert in concerts %}
              {% if ns.count < 3 %}
                {% set date_parts = concert.date.split('-') %}
                {% set concert_date = date_parts[2] ~ '-' ~ date_parts[1] ~ '-' ~ date_parts[0] %}
                {% set today = now().strftime('%Y-%m-%d') %}
                {% if concert_date < today %}
                  {% set ns.count = ns.count + 1 %}
          {{ concert.artist.name }} - {{ concert.date }}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
