refresh:
  name: Refresh
  description: Refresh one or all loaded setlist.fm entries and wait for the result.
  fields:
    entry_id:
      name: Entry ID
      description: >
        The loaded setlist.fm entry to refresh. If omitted, all loaded entries
        are refreshed. Empty, unknown, foreign or unloaded IDs are rejected.
      required: false
      selector:
        config_entry:
          integration: setlistfm
